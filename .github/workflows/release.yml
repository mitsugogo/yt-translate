name: Release Extension

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Chrome Extension

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${RELEASE_TAG#v}"

          echo "Git tag:               ${RELEASE_TAG}"
          echo "Git tag version:       ${TAG_VERSION}"

          if ! [[ "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vMAJOR.MINOR.PATCH format. Received: ${RELEASE_TAG}"
            exit 1
          fi

          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Sync package and manifest version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';

          const version = process.env.RELEASE_VERSION;
          for (const file of ['package.json', 'manifest.json']) {
            const data = JSON.parse(await readFile(file, 'utf8'));
            data.version = version;
            await writeFile(file, `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          }
          EOF

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [[ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" || "${MANIFEST_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Failed to synchronize package.json and manifest.json with ${RELEASE_VERSION}"
            exit 1
          fi

      - name: Check extension
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build extension ZIP
        run: pnpm zip

      - name: Resolve ZIP path
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find .output -maxdepth 1 -type f -name '*.zip' -print
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one extension ZIP, found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"

          echo "path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "name=$(basename "${ZIP_PATH}")" >> "${GITHUB_OUTPUT}"

          echo "Release asset:"
          ls -lh "${ZIP_PATH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: youtube-local-translator-${{ github.event.release.tag_name }}
          path: ${{ steps.zip.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.zip.outputs.path }}" \
            --clobber
