<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Local Translator</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div>
          <p class="eyebrow">端末内で処理</p>
          <h1>YouTube Local Translator</h1>
        </div>
        <label class="switch" title="翻訳を有効にする">
          <input id="enabled" type="checkbox" aria-label="翻訳を有効にする" />
          <span class="slider"></span>
        </label>
      </header>
      <p id="status" class="status">利用可能な機能を確認中…</p>
      <div id="progress" class="model-progress" hidden>
        <div class="progress-header"><span>モデルの準備</span><span id="progressLabel">準備中…</span></div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="モデルの準備" aria-valuemin="0" aria-valuemax="100">
          <span id="progressBar" class="progress-bar indeterminate"></span>
        </div>
      </div>
      <section class="settings">
        <label>話す言語 <select id="sourceLanguage"><option value="auto">自動（日・英・インドネシア語）</option><option value="ja-JP">日本語</option><option value="en-US">英語</option><option value="id-ID">インドネシア語</option></select></label>
        <label>自動判定の優先言語 <select id="autoLanguagePreference"><option value="channel">チャンネルから推定</option><option value="ja">日本語</option><option value="en">英語</option><option value="id">インドネシア語</option><option value="none">優先なし</option></select></label>
        <label>翻訳先 <select id="targetLanguage"><option value="ja">日本語</option><option value="en">英語</option><option value="id">インドネシア語</option></select></label>
        <label class="check"><input id="showOriginal" type="checkbox" /> 原文を表示</label>
        <label class="check"><input id="showTranslation" type="checkbox" /> 翻訳を表示</label>
        <label class="font-size">文字サイズ <input id="fontSize" type="range" min="12" max="22" step="1" /></label>
      </section>
      <button id="prepare" class="secondary" type="button">音声認識・翻訳モデルを準備</button>
      <p class="privacy">音声・文字起こし・翻訳は端末内で処理します。</p>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
